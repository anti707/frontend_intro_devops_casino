server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://casino-backend-service:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/bonos {
    proxy_pass http://bonos-service:8004/;
    }

    location /api/apuestas {
        proxy_pass http://apuestas-service:8005/;
    }

    location /api/estadisticas {
        proxy_pass http://estadisticas-service:8006/;
    }
    }
